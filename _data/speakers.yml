- name: "Prof. Pierpaolo Sorrentino, MD, PhD"
  affiliation: "Institut de Neurosciences des Systèmes (Inserm and Aix-Marseille University, France)"
  talk: "Building the Virtual Brain: Patient-Specific Models for Clinical Medicine"
  status: "Confirmed"
  photo: ""
  bio: /
      Prof. Pierpaolo Sorrentino, MD, PhD, is a Principal Investigator at the Institut de Neurosciences des Systèmes (Inserm and Aix-Marseille University, France) and a tenured associate Professor at Parthenope University, Naples, Italy. He is a board-certified neurologist, and he holds a Ph.D. in Telecommunication Engineering. 
      He subsequently worked as a postdoctoral researcher within the Human Brain Project, where he developed computational approaches to investigate large-scale brain dynamics, with a focus on Neurodegenerative diseases. His research has made extensive use of magnetoencephalography (MEG) to characterize functional brain networks and identify electrophysiological biomarkers, with a particular focus on critical dynamics. More recently, his group has focused on mechanistic whole-brain modeling, integrating electrophysiology, neuroimaging, and network science to infer latent physiological mechanisms underlying neurological diseases. His work was central to personalized computational models of Parkinson's disease, multiple sclerosis, amyotrophic lateral sclerosis, and other brain disorders, with the long-term goal of developing clinically actionable digital twins for diagnosis, prognosis, and treatment optimization. He has authored nearly 200 peer-reviewed scientific publications.
