speakers:
  - name: "Dr Ornella Dakwar"
    role: "Clinical neuroscientist"
    photo: "assets/img/past/ornella-dakwar.jpg"
    session: "Brain stimulation · Day 2"
    bio: "Specializes in non-invasive (tRNS, tDCS) and invasive (DBS) brain stimulation, with a focus on the neural correlates of cognition and clinical symptoms. At InnoSphere and Alpha Omega Engineering she developed neuromodulation protocols and supported neurotechnology innovation. Earlier she was Deputy Head of the Child Development and Rehabilitation Department at the Israeli Ministry of Health (2013–2018), and has managed clinical trials and translational neuroscience research since 2017."
  - name: "Prof Ravichander Janapati"
    role: "Professor of Engineering, SR University, India"
    photo: "assets/img/past/ravichander-janapati.jpg"
    session: "Brain-computer interfaces · Day 4"
    bio: "Professor in Electronics and Communication Engineering and Associate Dean of the School of Computer Science and Artificial Intelligence at SR University, Warangal, Telangana. His interests are brain-computer interfacing, biomedical signal processing, machine learning, artificial intelligence and wireless sensor networks."
  - name: "Hadi Bagheri"
    role: "Researcher in cognitive psychology"
    photo: "assets/img/past/hadi-bagheri.jpg"
    session: "ML pipeline for EEG analysis · Day 3"
    bio: "Graduate researcher in Cognitive Psychology at the Faculty of Neuroscience, University of Tabriz, working on computational neuroscience and machine learning for brain signal analysis. He is investigating CNNs and support vector machines for decoding cognitive patterns from EEG, and is passionate about practical end-to-end AI workflows for seizure detection and BCI systems."
  - name: "Dr David Andai, MD, MSc"
    role: "AKU Brain and Mind Institute"
    photo: "assets/img/past/david-andai.jpg"
    session: "Fireside chat · Day 1"
    bio: "A JKUAT graduate with an MPH in International Global Health, and a research assistant at the Brain and Mind Institute, Aga Khan University. Co-founder of Afiadata, a startup building health data science skills among medics. He works on ML/AI applications, imaging and wearable data analysis, with a particular interest in mental health and neuroscience research."
  - name: "Slobodan Tanackovic"
    role: "g.tec medical engineering GmbH"
    photo: "assets/img/past/slobodan-tanackovic.jpg"
    session: "Brain mapping · Day 1"
    bio: "Engineering and clinical neurophysiology background, with training in electroencephalography and evoked potentials. He was part of the epilepsy surgery program at the University Hospital of Coimbra, Portugal, and has extensive experience in intra-operative neuromonitoring in Portugal and England. He joined g.tec medical engineering in 2018 and is a BCI and neuroscience enthusiast."
  - name: "Fidel Makatia, HSC, MIEEE"
    role: "Analog and mixed-signal IC design engineer"
    photo: "assets/img/past/fidel-makatia.jpg"
    session: "Neuromorphic computing · Day 5"
    bio: "Graduate research assistant at Texas A&M University working across semiconductors, AI acceleration, system-on-chip design, high-speed interconnects and edge AI systems. Co-author of “A Short History of Circuits and Systems”, 2nd edition, and a 2020 United Nations Person of the Year Award recipient as principal inventor of the TibaVent ventilator."
  - name: "Prof Gaute Einevoll"
    role: "Professor of physics"
    photo: "assets/img/past/gaute-einevoll.jpg"
    session: "Brain-scale models · Day 5"
    bio: "Professor of physics at the Norwegian University of Life Sciences and the University of Oslo, working on brain physics and computational neuroscience: physics-type modelling of nerve cells, networks, brain tissue, brain signals and brain stimulation. Co-author of “Electric Brain Signals” (Cambridge, 2024) and “Principles of Computational Modelling in Neuroscience”, 2nd ed. (Cambridge, 2023), and host of the Theoretical Neuroscience Podcast."

