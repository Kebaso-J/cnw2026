<footer class="footer">
  <div class="wrap footer__grid">
    <div>
      <p class="footer__name">{{ site.title }}</p>
      <p>{{ site.edition }} &middot; {{ site.format }} &middot; {{ site.dates_display }}</p>
    </div>
    <div>
      <p>Organized by {{ site.organizer }}, {{ site.organizer_parent }}, {{ site.organizer_location }}.</p>
      <p><a href="mailto:{{ site.contact_email }}">{{ site.contact_email }}</a></p>
    </div>
  </div>
</footer>
